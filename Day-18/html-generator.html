<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HTML Generator - Day 18</title>

    <style>
        /* ---------- RESET & BASE ---------- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f1f5f9;
            color: #0f172a;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 24px;
            padding: 30px 25px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.06);
            animation: fadeSlideUp 0.6s ease-out;
        }

        @keyframes fadeSlideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ---------- HEADER ---------- */
        .header {
            text-align: center;
            margin-bottom: 28px;
        }

        .header .icon {
            font-size: 2.8rem;
            display: block;
        }

        .header h1 {
            font-size: 2rem;
            color: #0f172a;
            font-weight: 800;
        }

        .header p {
            color: #64748b;
            font-size: 0.95rem;
        }

        /* ---------- CONTROLS ---------- */
        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 24px;
            padding: 16px 20px;
            background: #f8fafc;
            border-radius: 16px;
            border: 1px solid #e2e8f0;
        }

        .controls input,
        .controls select {
            padding: 8px 14px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 0.95rem;
            transition: border-color 0.3s ease;
            flex: 1 1 150px;
        }

        .controls input:focus,
        .controls select:focus {
            outline: none;
            border-color: #3b82f6;
        }

        .controls button {
            padding: 8px 20px;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: transform 0.25s ease, box-shadow 0.25s ease;
            background: #0f172a;
            color: #fff;
        }

        .controls button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
        }

        .controls .btn-secondary {
            background: #eef2f6;
            color: #0f172a;
        }

        .controls .btn-secondary:hover {
            background: #e2e8f0;
        }

        /* ---------- STATS ---------- */
        .stats {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 20px;
            padding: 12px 16px;
            background: #f1f5f9;
            border-radius: 12px;
            font-size: 0.95rem;
        }

        .stats .stat-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .stats .stat-item .label {
            color: #64748b;
        }

        .stats .stat-item .value {
            font-weight: 700;
            color: #0f172a;
        }

        /* ---------- GRID ---------- */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 20px;
        }

        .card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            padding: 20px 18px 22px;
            transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
            border-color: #3b82f6;
        }

        .card .emoji {
            font-size: 2.6rem;
            text-align: center;
            display: block;
            margin-bottom: 10px;
        }

        .card .title {
            font-weight: 700;
            font-size: 1.1rem;
            color: #0f172a;
            margin-bottom: 4px;
        }

        .card .category {
            font-size: 0.75rem;
            font-weight: 600;
            color: #3b82f6;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
        }

        .card .description {
            font-size: 0.9rem;
            color: #64748b;
            margin-bottom: 10px;
            line-height: 1.5;
        }

        .card .price {
            font-size: 1.3rem;
            font-weight: 700;
            color: #0f172a;
        }

        .card .price .currency {
            font-size: 0.9rem;
            color: #64748b;
            font-weight: 400;
        }

        .card .tag {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 30px;
            font-size: 0.7rem;
            font-weight: 600;
            margin-top: 8px;
            margin-right: 6px;
        }

        .card .tag-sale {
            background: #fef2f2;
            color: #dc2626;
        }

        .card .tag-new {
            background: #f0fdf4;
            color: #16a34a;
        }

        .card .tag-featured {
            background: #fef3c7;
            color: #d97706;
        }

        /* ---------- EMPTY ---------- */
        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px 20px;
            color: #94a3b8;
        }

        .empty-state .big-emoji {
            font-size: 4rem;
            display: block;
            margin-bottom: 12px;
        }

        /* ---------- RESPONSIVE ---------- */
        @media (max-width: 500px) {
            .container {
                padding: 20px 16px;
            }
            .controls {
                flex-direction: column;
            }
            .controls input,
            .controls select,
            .controls button {
                flex: 1 1 100%;
                width: 100%;
            }
            .grid {
                grid-template-columns: 1fr;
            }
            .stats {
                flex-direction: column;
                gap: 8px;
            }
        }

        @media (min-width: 600px) {
            body {
                padding: 30px;
            }
            .container {
                padding: 40px;
            }
        }
    </style>
</head>
<body>

    <div class="container">

        <!-- HEADER -->
        <div class="header">
            <span class="icon">🏗️</span>
            <h1>HTML Generator</h1>
            <p>Template literals + string methods = dynamic HTML</p>
        </div>

        <!-- CONTROLS -->
        <div class="controls">
            <input
                type="text"
                id="searchInput"
                placeholder="🔍 Search..."
                oninput="renderContent()"
            />
            <select id="categoryFilter" onchange="renderContent()">
                <option value="all">All Categories</option>
            </select>
            <select id="sortSelect" onchange="renderContent()">
                <option value="default">Sort by: Default</option>
                <option value="price-low">Price: Low to High</option>
                <option value="price-high">Price: High to Low</option>
                <option value="name">Name: A to Z</option>
            </select>
            <button onclick="resetFilters()">🔄 Reset</button>
        </div>

        <!-- STATS -->
        <div class="stats" id="statsContainer">
            <span class="stat-item">
                <span class="label">📦 Total:</span>
                <span class="value" id="totalCount">0</span>
            </span>
            <span class="stat-item">
                <span class="label">💰 Average Price:</span>
                <span class="value" id="avgPrice">$0.00</span>
            </span>
            <span class="stat-item">
                <span class="label">🏷️ Categories:</span>
                <span class="value" id="categoryCount">0</span>
            </span>
            <span class="stat-item">
                <span class="label">📈 Price Range:</span>
                <span class="value" id="priceRange">$0 - $0</span>
            </span>
        </div>

        <!-- GRID -->
        <div class="grid" id="contentGrid">
            <!-- Content will be generated here -->
        </div>

    </div>

    <!-- ============================================================ -->
    <!-- JAVASCRIPT                                                    -->
    <!-- ============================================================ -->
    <script>
        /**
         * ============================================================
         * PART 1: DATA (Array of Products)
         * ============================================================
         * This is our source data. We'll use template literals to
         * generate HTML from this data.
         */

        const products = [{
            id: 1,
            name: 'Wireless Headphones Pro',
            category: 'electronics',
            price: 79.99,
            description: 'Premium noise-canceling headphones with 30-hour battery life and crystal-clear audio.',
            emoji: '🎧',
            tags: ['new', 'featured']
        }, {
            id: 2,
            name: 'Smart Watch Series 5',
            category: 'electronics',
            price: 249.99,
            description: 'Track your fitness, heart rate, sleep, and stay connected with notifications.',
            emoji: '⌚',
            tags: ['featured']
        }, {
            id: 3,
            name: 'Laptop Backpack Pro',
            category: 'accessories',
            price: 49.99,
            description: 'Water-resistant backpack with USB charging port, padded laptop sleeve, and multiple compartments.',
            emoji: '🎒',
            tags: ['sale']
        }, {
            id: 4,
            name: 'Bluetooth Speaker X2',
            category: 'electronics',
            price: 89.99,
            description: 'Portable waterproof speaker with 360° sound, 20-hour battery, and built-in microphone.',
            emoji: '🔊',
            tags: ['new']
        }, {
            id: 5,
            name: 'Ceramic Coffee Mug',
            category: 'home',
            price: 12.99,
            description: 'Premium ceramic mug with heat-resistant handle, large capacity, and elegant design.',
            emoji: '☕',
            tags: []
        }, {
            id: 6,
            name: 'LED Desk Lamp',
            category: 'home',
            price: 34.99,
            description: 'Adjustable LED desk lamp with 3 brightness levels, color temperature control, and USB charging port.',
            emoji: '💡',
            tags: ['sale']
        }, {
            id: 7,
            name: 'Phone Case Ultra',
            category: 'accessories',
            price: 19.99,
            description: 'Durable shockproof case with built-in screen protector, raised edges, and camera protection.',
            emoji: '📱',
            tags: []
        }, {
            id: 8,
            name: 'Power Bank 20000mAh',
            category: 'electronics',
            price: 39.99,
            description: 'Fast-charging portable power bank with dual USB ports and LED battery indicator.',
            emoji: '🔋',
            tags: ['featured']
        }, {
            id: 9,
            name: 'Insulated Water Bottle',
            category: 'home',
            price: 24.99,
            description: 'Stainless steel insulated bottle with double-wall vacuum technology. Keeps drinks cold for 24 hours.',
            emoji: '🧴',
            tags: ['new']
        }, {
            id: 10,
            name: 'Wireless Mouse Pro',
            category: 'electronics',
            price: 29.99,
            description: 'Ergonomic wireless mouse with silent clicks, adjustable DPI, and long battery life.',
            emoji: '🖱️',
            tags: []
        }, {
            id: 11,
            name: 'Premium Notebook Set',
            category: 'accessories',
            price: 14.99,
            description: 'Set of 3 ruled notebooks with durable covers, perforated pages, and ribbon bookmarks.',
            emoji: '📓',
            tags: ['sale']
        }, {
            id: 12,
            name: 'Ceramic Plant Pot',
            category: 'home',
            price: 22.99,
            description: 'Handcrafted ceramic plant pot with drainage hole, saucer, and glazed finish.',
            emoji: '🪴',
            tags: []
        }];


        /**
         * ============================================================
         * PART 2: HELPER FUNCTIONS (Using String Methods)
         * ============================================================
         */

        /**
         * capitalize
         * Capitalizes the first letter of a string.
         * Uses: toUpperCase(), slice()
         */
        function capitalize(str) {
            if (!str) return '';
            return str.charAt(0).toUpperCase() + str.slice(1).toLowerCase();
        }

        /**
         * formatPrice
         * Formats a price with a dollar sign and 2 decimal places.
         * Uses: toFixed()
         */
        function formatPrice(price) {
            return `$${price.toFixed(2)}`;
        }

        /**
         * getTagClass
         * Returns the CSS class for a tag.
         * Uses: includes()
         */
        function getTagClass(tag) {
            if (tag === 'sale') return 'tag-sale';
            if (tag === 'new') return 'tag-new';
            if (tag === 'featured') return 'tag-featured';
            return '';
        }

        /**
         * getTagEmoji
         * Returns an emoji for a tag.
         * Uses: includes() with multiple checks
         */
        function getTagEmoji(tag) {
            if (tag === 'sale') return '🔥';
            if (tag === 'new') return '✨';
            if (tag === 'featured') return '⭐';
            return '';
        }

        /**
         * truncateText
         * Truncates text to a maximum length and adds "...".
         * Uses: slice(), includes()
         */
        function truncateText(text, maxLength = 100) {
            if (!text) return '';
            if (text.length <= maxLength) return text;
            const truncated = text.slice(0, maxLength);
            // Find the last space to avoid cutting in the middle of a word
            const lastSpace = truncated.lastIndexOf(' ');
            const result = lastSpace > 0 ? truncated.slice(0, lastSpace) : truncated;
            return `${result}...`;
        }

        /**
         * generateId
         * Generates a unique ID for DOM elements.
         * Uses: toLowerCase(), replace()
         */
        function generateId(name) {
            return name.toLowerCase().replace(/\s+/g, '-').replace(/[^a-z0-9-]/g, '');
        }


        /**
         * ============================================================
         * PART 3: HTML GENERATOR (Using Template Literals)
         * ============================================================
         * This is where the magic happens! We use template literals
         * to generate clean HTML from our data.
         */

        /**
         * generateCardHTML
         * Generates HTML for a single product card.
         * Uses: Template literals, string methods
         */
        function generateCardHTML(product) {
            // --- Destructure the product ---
            const {
                id,
                name,
                category,
                price,
                description,
                emoji,
                tags
            } = product;

            // --- Format the price ---
            const formattedPrice = formatPrice(price);

            // --- Generate tag HTML (using map, join, and template literals) ---
            const tagsHTML = tags.length > 0 ?
                tags.map(tag => {
                    const tagClass = getTagClass(tag);
                    const tagEmoji = getTagEmoji(tag);
                    return `<span class="tag ${tagClass}">${tagEmoji} ${capitalize(tag)}</span>`;
                }).join('') :
                '';

            // --- Generate the card HTML using template literals ---
            return `
                <div class="card" data-id="${id}">
                    <span class="emoji">${emoji}</span>
                    <div class="category">${capitalize(category)}</div>
                    <div class="title">${name}</div>
                    <div class="description">${truncateText(description, 80)}</div>
                    <div class="price">
                        <span class="currency">$</span>${price.toFixed(2)}
                    </div>
                    <div>
                        ${tagsHTML}
                    </div>
                </div>
            `;
        }

        /**
         * generateGridHTML
         * Generates HTML for the entire grid.
         * Uses: map() with template literals
         */
        function generateGridHTML(products) {
            if (products.length === 0) {
                return `
                    <div class="empty-state">
                        <span class="big-emoji">🔍</span>
                        <h3>No products found</h3>
                        <p style="color: #94a3b8;">Try adjusting your filters.</p>
                    </div>
                `;
            }

            // --- Use map() with template literals ---
            return products.map(product => generateCardHTML(product)).join('');
        }


        /**
         * ============================================================
         * PART 4: FILTERING & SORTING (Using String Methods)
         * ============================================================
         */

        /**
         * filterProducts
         * Filters products based on search term and category.
         * Uses: toLowerCase(), includes(), trim()
         */
        function filterProducts(products, searchTerm, category) {
            const term = searchTerm.trim().toLowerCase();

            return products.filter(product => {
                // --- Category filter ---
                if (category !== 'all' && product.category !== category) {
                    return false;
                }

                // --- Search filter (name, category, or description) ---
                if (term) {
                    const nameMatch = product.name.toLowerCase().includes(term);
                    const categoryMatch = product.category.toLowerCase().includes(term);
                    const descMatch = product.description.toLowerCase().includes(term);
                    if (!nameMatch && !categoryMatch && !descMatch) {
                        return false;
                    }
                }

                return true;
            });
        }

        /**
         * sortProducts
         * Sorts products based on the selected option.
         * Uses: localeCompare() for string comparison
         */
        function sortProducts(products, sortBy) {
            const sorted = [...products];

            switch (sortBy) {
                case 'price-low':
                    sorted.sort((a, b) => a.price - b.price);
                    break;
                case 'price-high':
                    sorted.sort((a, b) => b.price - a.price);
                    break;
                case 'name':
                    sorted.sort((a, b) => a.name.localeCompare(b.name));
                    break;
                default:
                    // Default: sort by ID
                    sorted.sort((a, b) => a.id - b.id);
            }

            return sorted;
        }


        /**
         * ============================================================
         * PART 5: STATS CALCULATION (Using Array Methods & Template Literals)
         * ============================================================
         */

        /**
         * calculateStats
         * Calculates statistics for the filtered products.
         * Uses: reduce(), toFixed()
         */
        function calculateStats(products) {
            const total = products.length;

            if (total === 0) {
                return {
                    total: 0,
                    avgPrice: 0,
                    categoryCount: 0,
                    minPrice: 0,
                    maxPrice: 0
                };
            }

            // --- Calculate total price using reduce() ---
            const totalPrice = products.reduce((sum, p) => sum + p.price, 0);
            const avgPrice = totalPrice / total;

            // --- Get unique categories ---
            const categories = new Set(products.map(p => p.category));
            const categoryCount = categories.size;

            // --- Get price range ---
            const prices = products.map(p => p.price);
            const minPrice = Math.min(...prices);
            const maxPrice = Math.max(...prices);

            return {
                total,
                avgPrice,
                categoryCount,
                minPrice,
                maxPrice
            };
        }


        /**
         * ============================================================
         * PART 6: RENDER FUNCTION (Updates the DOM)
         * ============================================================
         * This is the main function that puts everything together.
         * It uses innerHTML to inject content into the DOM.
         */

        function renderContent() {
            // --- Get filter values ---
            const searchTerm = document.getElementById('searchInput').value;
            const category = document.getElementById('categoryFilter').value;
            const sortBy = document.getElementById('sortSelect').value;

            // --- Filter products ---
            let filtered = filterProducts(products, searchTerm, category);

            // --- Sort products ---
            filtered = sortProducts(filtered, sortBy);

            // --- Generate HTML using template literals ---
            const gridHTML = generateGridHTML(filtered);

            // --- Inject into the DOM ---
            document.getElementById('contentGrid').innerHTML = gridHTML;

            // --- Update stats ---
            const stats = calculateStats(filtered);
            document.getElementById('totalCount').textContent = stats.total;
            document.getElementById('avgPrice').textContent = `$${stats.avgPrice.toFixed(2)}`;
            document.getElementById('categoryCount').textContent = stats.categoryCount;

            // --- Format price range with template literals ---
            document.getElementById('priceRange').textContent =
                stats.total > 0 ? `$${stats.minPrice.toFixed(2)} - $${stats.maxPrice.toFixed(2)}` :
                '$0 - $0';
        }


        /**
         * ============================================================
         * PART 7: POPULATE CATEGORY FILTER
         * ============================================================
         * Uses Set and map() with template literals
         */

        function populateCategoryFilter() {
            const categories = [...new Set(products.map(p => p.category))];
            const select = document.getElementById('categoryFilter');

            // Add "All" option
            let optionsHTML = `<option value="all">All Categories</option>`;

            // Use map() and join() with template literals
            optionsHTML += categories
                .map(category => `<option value="${category}">${capitalize(category)}</option>`)
                .join('');

            select.innerHTML = optionsHTML;
        }


        /**
         * ============================================================
         * PART 8: RESET FILTERS
         * ============================================================
         */

        function resetFilters() {
            document.getElementById('searchInput').value = '';
            document.getElementById('categoryFilter').value = 'all';
            document.getElementById('sortSelect').value = 'default';
            renderContent();
        }


        /**
         * ============================================================
         * PART 9: INITIALIZATION
         * ============================================================
         */

        populateCategoryFilter();
        renderContent();


        /**
         * ============================================================
         * PART 10: DEMONSTRATION (Console Output)
         * ============================================================
         * These examples show template literals and string methods in action.
         * (Open the browser console to see the output!)
         */

        console.log('\n=== DAY 18: TEMPLATE LITERALS & STRING METHODS ===\n');

        // --- 1. Template Literals ---
        console.log('--- 1. Template Literals ---');

        const name = 'Alice';
        const age = 30;
        const city = 'New York';

        // Basic interpolation
        console.log(`Hello, ${name}! You are ${age} years old.`);

        // Multi-line strings
        const multiLine = `
            Name: ${name}
            Age: ${age}
            City: ${city}
        `;
        console.log('Multi-line:\n', multiLine);

        // Expression interpolation
        console.log(`In 5 years, ${name} will be ${age + 5} years old.`);
        console.log(`Today is ${new Date().toLocaleDateString()}.`);

        // Ternary operator
        console.log(`${name} is ${age >= 18 ? 'an adult' : 'a minor'}.`);

        // Function call
        console.log(`Uppercase: ${name.toUpperCase()}`);

        // Object property access
        const product = { name: 'Laptop', price: 999.99 };
        console.log(`The ${product.name} costs ${formatPrice(product.price)}.`);

        // --- 2. String Methods ---
        console.log('\n--- 2. String Methods ---');

        const sampleText = '  Hello, World!  ';
        console.log('Original:', `"${sampleText}"`);
        console.log('trim():', `"${sampleText.trim()}"`);
        console.log('toLowerCase():', sampleText.toLowerCase());
        console.log('toUpperCase():', sampleText.toUpperCase());

        const sentence = 'The quick brown fox jumps over the lazy dog.';
        console.log('Sentence:', sentence);
        console.log('includes("fox"):', sentence.includes('fox'));
        console.log('startsWith("The"):', sentence.startsWith('The'));
        console.log('endsWith("dog."):', sentence.endsWith('dog.'));
        console.log('indexOf("brown"):', sentence.indexOf('brown'));
        console.log('split(" "):', sentence.split(' ').slice(0, 5), '...');

        const fruits = 'apple,banana,orange,grape';
        console.log('Fruits string:', fruits);
        console.log('split(","):', fruits.split(','));

        const repeated = 'abc'.repeat(3);
        console.log('"abc".repeat(3):', repeated);

        const padded = '42'.padStart(5, '0');
        console.log('"42".padStart(5, "0"):', padded);

        const replaced = 'Hello, world! Hello, universe!'.replaceAll('Hello', 'Hi');
        console.log('replaceAll("Hello", "Hi"):', replaced);

        // --- 3. HTML Generator in Action ---
        console.log('\n--- 3. HTML Generator ---');
        console.log(`Generated ${products.length} product cards.`);
        console.log('Categories:', [...new Set(products.map(p => p.category))]);
        console.log('Price range:', formatPrice(Math.min(...products.map(p => p.price))), '-',
            formatPrice(Math.max(...products.map(p => p.price))));

        // --- 4. Template Literals with HTML ---
        console.log('\n--- 4. Template Literals with HTML ---');

        const sampleProduct = products[0];
        const sampleHTML = `
            <div class="card">
                <span class="emoji">${sampleProduct.emoji}</span>
                <div class="title">${sampleProduct.name}</div>
                <div class="price">${formatPrice(sampleProduct.price)}</div>
            </div>
        `;
        console.log('Sample HTML generated:\n', sampleHTML.trim());

        console.log('\n=== HTML Generator is ready! Try searching and filtering. ===');
    </script>

</body>
</html>
