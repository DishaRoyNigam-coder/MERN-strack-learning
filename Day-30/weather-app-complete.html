<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather App - Complete</title>

    <style>
        /* ---------- RESET & BASE ---------- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #e2e8f0;
        }

        .container {
            max-width: 720px;
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 32px;
            padding: 35px 30px 30px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 25px 80px rgba(0, 0, 0, 0.6);
            animation: fadeSlideUp 0.7s ease-out;
        }

        @keyframes fadeSlideUp {
            from {
                opacity: 0;
                transform: translateY(40px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ---------- HEADER ---------- */
        .header {
            text-align: center;
            margin-bottom: 24px;
        }

        .header .icon {
            font-size: 2.6rem;
            display: block;
        }

        .header h1 {
            font-size: 1.8rem;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: -0.5px;
        }

        .header p {
            color: #94a3b8;
            font-size: 0.9rem;
        }

        /* ---------- SEARCH ---------- */
        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }

        .search-box .input-wrapper {
            flex: 1;
            position: relative;
            min-width: 180px;
        }

        .search-box input {
            width: 100%;
            padding: 14px 18px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.06);
            color: #e2e8f0;
            font-size: 1rem;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .search-box input::placeholder {
            color: #64748b;
        }

        .search-box input:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.15);
        }

        .search-box input:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .search-box .btn-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .search-box button {
            padding: 14px 20px;
            border: none;
            border-radius: 16px;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            transition: transform 0.25s ease, box-shadow 0.25s ease, background 0.25s ease;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .search-box button:hover:not(:disabled) {
            transform: translateY(-2px);
        }

        .search-box button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        .btn-search {
            background: #3b82f6;
            color: #fff;
        }

        .btn-search:hover:not(:disabled) {
            background: #2563eb;
            box-shadow: 0 8px 30px rgba(59, 130, 246, 0.3);
        }

        .btn-location {
            background: rgba(255, 255, 255, 0.08);
            color: #e2e8f0;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .btn-location:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.14);
        }

        .btn-unit {
            background: rgba(255, 255, 255, 0.06);
            color: #94a3b8;
            border: 1px solid rgba(255, 255, 255, 0.06);
            font-size: 0.85rem;
            padding: 14px 16px;
        }

        .btn-unit.active {
            background: #3b82f6;
            color: #fff;
            border-color: #3b82f6;
        }

        .btn-unit:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.12);
        }

        .btn-unit.active:hover:not(:disabled) {
            background: #2563eb;
        }

        /* ---------- LOADING ---------- */
        .loading {
            display: none;
            text-align: center;
            padding: 40px 20px;
        }

        .loading.visible {
            display: block;
            animation: pulse 1.2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .loading .spinner {
            display: inline-block;
            width: 44px;
            height: 44px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top-color: #3b82f6;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 12px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading p {
            color: #94a3b8;
        }

        /* ---------- ERROR ---------- */
        .error-box {
            display: none;
            padding: 16px 20px;
            background: rgba(239, 68, 68, 0.15);
            border: 2px solid rgba(239, 68, 68, 0.3);
            border-radius: 16px;
            color: #fca5a5;
            margin-bottom: 16px;
            backdrop-filter: blur(10px);
        }

        .error-box.visible {
            display: block;
            animation: fadeIn 0.3s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .error-box .error-title {
            font-weight: 700;
            display: block;
            margin-bottom: 4px;
        }

        /* ---------- WEATHER DISPLAY ---------- */
        .weather-display {
            display: none;
            animation: fadeIn 0.5s ease-out;
        }

        .weather-display.visible {
            display: block;
        }

        /* Current Weather */
        .current-weather {
            text-align: center;
            padding: 20px 0 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            margin-bottom: 20px;
        }

        .current-weather .city-name {
            font-size: 2rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 2px;
        }

        .current-weather .city-country {
            font-size: 0.9rem;
            color: #94a3b8;
            margin-bottom: 12px;
        }

        .current-weather .weather-icon {
            font-size: 4.5rem;
            margin-bottom: 4px;
            transition: transform 0.5s ease;
        }

        .current-weather .weather-icon:hover {
            transform: scale(1.1) rotate(-5deg);
        }

        .current-weather .temperature {
            font-size: 4rem;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: -2px;
        }

        .current-weather .temperature .degree {
            font-size: 2rem;
            font-weight: 400;
            color: #94a3b8;
        }

        .current-weather .weather-desc {
            font-size: 1.1rem;
            color: #94a3b8;
            margin-top: 2px;
        }

        .current-weather .update-time {
            font-size: 0.75rem;
            color: #64748b;
            margin-top: 8px;
        }

        /* Weather Details Grid */
        .weather-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 12px;
            margin-bottom: 24px;
        }

        .detail-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 16px;
            padding: 14px 12px;
            text-align: center;
            backdrop-filter: blur(10px);
            transition: transform 0.2s ease, background 0.2s ease;
        }

        .detail-card:hover {
            transform: translateY(-2px);
            background: rgba(255, 255, 255, 0.08);
        }

        .detail-card .detail-icon {
            font-size: 1.4rem;
            display: block;
            margin-bottom: 4px;
        }

        .detail-card .detail-value {
            font-size: 1.1rem;
            font-weight: 700;
            color: #ffffff;
        }

        .detail-card .detail-label {
            font-size: 0.75rem;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* ---------- FORECAST ---------- */
        .forecast-section h3 {
            font-size: 1rem;
            font-weight: 600;
            color: #94a3b8;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .forecast-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(80px, 1fr));
            gap: 10px;
        }

        .forecast-day {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 14px;
            padding: 12px 8px;
            text-align: center;
            transition: transform 0.2s ease, background 0.2s ease;
        }

        .forecast-day:hover {
            transform: translateY(-3px);
            background: rgba(255, 255, 255, 0.08);
        }

        .forecast-day .day-name {
            font-size: 0.8rem;
            font-weight: 600;
            color: #94a3b8;
        }

        .forecast-day .day-icon {
            font-size: 2rem;
            display: block;
            margin: 4px 0;
        }

        .forecast-day .day-temp {
            font-size: 1rem;
            font-weight: 700;
            color: #ffffff;
        }

        .forecast-day .day-temp .temp-low {
            font-weight: 400;
            color: #94a3b8;
            font-size: 0.85rem;
        }

        /* ---------- RESPONSIVE ---------- */
        @media (max-width: 600px) {
            .container {
                padding: 24px 16px;
                border-radius: 24px;
            }

            .search-box {
                flex-direction: column;
            }

            .search-box .input-wrapper {
                min-width: unset;
            }

            .search-box .btn-group {
                justify-content: stretch;
            }

            .search-box .btn-group button {
                flex: 1;
                justify-content: center;
            }

            .current-weather .city-name {
                font-size: 1.6rem;
            }

            .current-weather .temperature {
                font-size: 3rem;
            }

            .current-weather .weather-icon {
                font-size: 3.5rem;
            }

            .weather-details {
                grid-template-columns: repeat(2, 1fr);
            }

            .forecast-grid {
                grid-template-columns: repeat(auto-fit, minmax(65px, 1fr));
                gap: 6px;
            }

            .forecast-day {
                padding: 8px 4px;
            }

            .forecast-day .day-icon {
                font-size: 1.5rem;
            }

            .forecast-day .day-temp {
                font-size: 0.85rem;
            }
        }

        @media (max-width: 380px) {
            .weather-details {
                grid-template-columns: 1fr 1fr;
                gap: 8px;
            }

            .forecast-grid {
                grid-template-columns: repeat(3, 1fr);
            }

            .search-box .btn-group button {
                font-size: 0.8rem;
                padding: 12px 14px;
            }
        }
    </style>
</head>
<body>

    <div class="container">

        <!-- HEADER -->
        <div class="header">
            <span class="icon">🌤️</span>
            <h1>Weather App</h1>
            <p>Powered by Open-Meteo — Free & No API Key Required</p>
        </div>

        <!-- SEARCH -->
        <div class="search-box">
            <div class="input-wrapper">
                <input
                    type="text"
                    id="cityInput"
                    placeholder="Enter city name (e.g., London, Tokyo)"
                    value=""
                />
            </div>
            <div class="btn-group">
                <button class="btn-search" id="searchBtn">🔍 Search</button>
                <button class="btn-location" id="locationBtn">📍 My Location</button>
                <button class="btn-unit" id="unitBtn">°F</button>
            </div>
        </div>

        <!-- LOADING -->
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Fetching weather data...</p>
        </div>

        <!-- ERROR -->
        <div class="error-box" id="errorBox">
            <span class="error-title">❌ Error</span>
            <span id="errorMessage">Something went wrong.</span>
        </div>

        <!-- WEATHER DISPLAY -->
        <div class="weather-display" id="weatherDisplay">

            <!-- Current Weather -->
            <div class="current-weather">
                <div class="city-name" id="cityName">London</div>
                <div class="city-country" id="cityCountry">United Kingdom</div>
                <div class="weather-icon" id="weatherIcon">☀️</div>
                <div class="temperature" id="temperature">18<span class="degree">°C</span></div>
                <div class="weather-desc" id="weatherDesc">Clear sky</div>
                <div class="update-time" id="updateTime">Last updated: now</div>
            </div>

            <!-- Weather Details -->
            <div class="weather-details" id="weatherDetails">
                <div class="detail-card">
                    <span class="detail-icon">💧</span>
                    <div class="detail-value" id="humidity">—</div>
                    <div class="detail-label">Humidity</div>
                </div>
                <div class="detail-card">
                    <span class="detail-icon">💨</span>
                    <div class="detail-value" id="windSpeed">—</div>
                    <div class="detail-label">Wind Speed</div>
                </div>
                <div class="detail-card">
                    <span class="detail-icon">🌡️</span>
                    <div class="detail-value" id="feelsLike">—</div>
                    <div class="detail-label">Feels Like</div>
                </div>
                <div class="detail-card">
                    <span class="detail-icon">☀️</span>
                    <div class="detail-value" id="uvIndex">—</div>
                    <div class="detail-label">UV Index</div>
                </div>
            </div>

            <!-- Forecast -->
            <div class="forecast-section">
                <h3>📅 7-Day Forecast</h3>
                <div class="forecast-grid" id="forecastGrid">
                    <!-- Forecast days will be rendered here -->
                </div>
            </div>

        </div>

    </div>

    <!-- ============================================================ -->
    <!-- JAVASCRIPT                                                    -->
    <!-- ============================================================ -->
    <script>
        /**
         * ============================================================
         * PART 1: CONFIGURATION
         * ============================================================
         */

        const API_BASE = 'https://api.open-meteo.com/v1/forecast';
        const GEO_BASE = 'https://geocoding-api.open-meteo.com/v1/search';

        const STORAGE_KEY = 'weather_app_last_city';
        const UNIT_KEY = 'weather_app_unit';

        const WEATHER_CODES = {
            0: { icon: '☀️', label: 'Clear sky' },
            1: { icon: '🌤️', label: 'Mainly clear' },
            2: { icon: '⛅', label: 'Partly cloudy' },
            3: { icon: '☁️', label: 'Overcast' },
            45: { icon: '🌫️', label: 'Fog' },
            48: { icon: '🌫️', label: 'Depositing rime fog' },
            51: { icon: '🌦️', label: 'Light drizzle' },
            53: { icon: '🌦️', label: 'Moderate drizzle' },
            55: { icon: '🌧️', label: 'Dense drizzle' },
            56: { icon: '🌧️', label: 'Light freezing drizzle' },
            57: { icon: '🌧️', label: 'Dense freezing drizzle' },
            61: { icon: '🌧️', label: 'Slight rain' },
            63: { icon: '🌧️', label: 'Moderate rain' },
            65: { icon: '🌧️', label: 'Heavy rain' },
            66: { icon: '🌧️', label: 'Light freezing rain' },
            67: { icon: '🌧️', label: 'Heavy freezing rain' },
            71: { icon: '🌨️', label: 'Slight snow fall' },
            73: { icon: '🌨️', label: 'Moderate snow fall' },
            75: { icon: '🌨️', label: 'Heavy snow fall' },
            77: { icon: '🌨️', label: 'Snow grains' },
            80: { icon: '🌧️', label: 'Slight rain showers' },
            81: { icon: '🌧️', label: 'Moderate rain showers' },
            82: { icon: '🌧️', label: 'Violent rain showers' },
            85: { icon: '🌨️', label: 'Slight snow showers' },
            86: { icon: '🌨️', label: 'Heavy snow showers' },
            95: { icon: '⛈️', label: 'Thunderstorm' },
            96: { icon: '⛈️', label: 'Thunderstorm with slight hail' },
            99: { icon: '⛈️', label: 'Thunderstorm with heavy hail' }
        };

        /**
         * ============================================================
         * PART 2: STATE
         * ============================================================
         */

        let currentUnit = 'c'; // 'c' or 'f'
        let isCelsius = true;
        let currentCity = 'London';

        /**
         * ============================================================
         * PART 3: DOM REFERENCES
         * ============================================================
         */

        const cityInput = document.getElementById('cityInput');
        const searchBtn = document.getElementById('searchBtn');
        const locationBtn = document.getElementById('locationBtn');
        const unitBtn = document.getElementById('unitBtn');
        const loading = document.getElementById('loading');
        const errorBox = document.getElementById('errorBox');
        const errorMessage = document.getElementById('errorMessage');
        const weatherDisplay = document.getElementById('weatherDisplay');
        const cityName = document.getElementById('cityName');
        const cityCountry = document.getElementById('cityCountry');
        const weatherIcon = document.getElementById('weatherIcon');
        const temperature = document.getElementById('temperature');
        const weatherDesc = document.getElementById('weatherDesc');
        const updateTime = document.getElementById('updateTime');
        const humidity = document.getElementById('humidity');
        const windSpeed = document.getElementById('windSpeed');
        const feelsLike = document.getElementById('feelsLike');
        const uvIndex = document.getElementById('uvIndex');
        const forecastGrid = document.getElementById('forecastGrid');

        /**
         * ============================================================
         * PART 4: HELPER FUNCTIONS
         * ============================================================
         */

        function showLoading(visible) {
            loading.classList.toggle('visible', visible);
            // Disable inputs while loading
            cityInput.disabled = visible;
            searchBtn.disabled = visible;
            locationBtn.disabled = visible;
        }

        function showError(message) {
            errorMessage.textContent = message;
            errorBox.classList.add('visible');
            clearTimeout(errorBox._timeout);
            errorBox._timeout = setTimeout(() => {
                errorBox.classList.remove('visible');
            }, 6000);
        }

        function hideError() {
            errorBox.classList.remove('visible');
        }

        function showWeather(visible) {
            weatherDisplay.classList.toggle('visible', visible);
        }

        function getWeatherIcon(code) {
            return WEATHER_CODES[code] || { icon: '❓', label: 'Unknown' };
        }

        function getDayName(dateStr) {
            const days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
            const date = new Date(dateStr);
            return days[date.getDay()];
        }

        function formatTime(date) {
            return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }

        function convertTemp(celsius) {
            if (isCelsius) return celsius;
            return (celsius * 9 / 5) + 32;
        }

        function formatTemp(celsius) {
            const value = convertTemp(celsius);
            const unit = isCelsius ? '°C' : '°F';
            return `${Math.round(value)}<span class="degree">${unit}</span>`;
        }

        function formatTempValue(celsius) {
            const value = convertTemp(celsius);
            return Math.round(value);
        }

        function getUnitSymbol() {
            return isCelsius ? '°C' : '°F';
        }

        function getWindUnit() {
            return isCelsius ? 'km/h' : 'mph';
        }

        function capitalizeWords(str) {
            return str.split(' ')
                .map(word => word.charAt(0).toUpperCase() + word.slice(1).toLowerCase())
                .join(' ');
        }

        /**
         * ============================================================
         * PART 5: API CALLS
         * ============================================================
         */

        async function geocodeCity(cityName) {
            const url = `${GEO_BASE}?name=${encodeURIComponent(cityName)}&count=1&language=en&format=json`;

            const response = await fetch(url);

            if (!response.ok) {
                throw new Error(`Geocoding API error: ${response.status}`);
            }

            const data = await response.json();

            if (!data.results || data.results.length === 0) {
                throw new Error(`City "${cityName}" not found. Please check the spelling.`);
            }

            const result = data.results[0];
            return {
                latitude: result.latitude,
                longitude: result.longitude,
                name: result.name,
                country: result.country || result.admin1 || 'Unknown'
            };
        }

        async function fetchWeather(lat, lon) {
            const params = new URLSearchParams({
                latitude: lat,
                longitude: lon,
                current_weather: true,
                daily: 'temperature_2m_max,temperature_2m_min,weathercode,uv_index_max',
                timezone: 'auto',
                forecast_days: 7
            });

            const url = `${API_BASE}?${params}`;

            const response = await fetch(url);

            if (!response.ok) {
                throw new Error(`Weather API error: ${response.status}`);
            }

            const data = await response.json();

            if (!data.current_weather) {
                throw new Error('Invalid weather data received.');
            }

            return data;
        }

        /**
         * ============================================================
         * PART 6: RENDER FUNCTIONS
         * ============================================================
         */

        function renderCurrentWeather(weather, location) {
            const current = weather.current_weather;

            cityName.textContent = location.name;
            cityCountry.textContent = location.country;

            // Temperature
            temperature.innerHTML = formatTemp(current.temperature);

            // Weather icon and description
            const weatherInfo = getWeatherIcon(current.weathercode);
            weatherIcon.textContent = weatherInfo.icon;
            weatherDesc.textContent = weatherInfo.label;

            // Update time
            const now = new Date();
            updateTime.textContent = `Last updated: ${formatTime(now)}`;

            // Humidity (not available in free tier, use placeholder)
            humidity.textContent = weather.current_weather.relative_humidity !== undefined ?
                `${weather.current_weather.relative_humidity}%` :
                '—';

            // Wind speed
            const windKmh = current.windspeed || 0;
            const windValue = isCelsius ? windKmh : windKmh * 0.621371;
            const windUnit = getWindUnit();
            windSpeed.textContent = `${windValue.toFixed(1)} ${windUnit}`;

            // Feels like
            feelsLike.textContent = formatTempValue(current.temperature) + getUnitSymbol();

            // UV Index (from daily data)
            if (weather.daily && weather.daily.uv_index_max && weather.daily.uv_index_max.length > 0) {
                const uv = weather.daily.uv_index_max[0];
                uvIndex.textContent = uv !== undefined ? uv.toFixed(1) : '—';
            } else {
                uvIndex.textContent = '—';
            }
        }

        function renderForecast(weather) {
            if (!weather.daily) {
                forecastGrid.innerHTML = '<p style="color: #94a3b8;">No forecast data available.</p>';
                return;
            }

            const days = weather.daily.time.length;
            const maxTemps = weather.daily.temperature_2m_max || [];
            const minTemps = weather.daily.temperature_2m_min || [];
            const codes = weather.daily.weathercode || [];

            let html = '';

            for (let i = 0; i < Math.min(days, 7); i++) {
                const dayName = i === 0 ? 'Today' : getDayName(weather.daily.time[i]);
                const weatherInfo = getWeatherIcon(codes[i] || 0);
                const maxTemp = maxTemps[i] !== undefined ? formatTempValue(maxTemps[i]) : '—';
                const minTemp = minTemps[i] !== undefined ? formatTempValue(minTemps[i]) : '—';

                html += `
                    <div class="forecast-day">
                        <div class="day-name">${dayName}</div>
                        <span class="day-icon">${weatherInfo.icon}</span>
                        <div class="day-temp">
                            ${maxTemp}°<span class="temp-low">${minTemp}°</span>
                        </div>
                    </div>
                `;
            }

            forecastGrid.innerHTML = html;
        }

        function renderAll(weather, location) {
            renderCurrentWeather(weather, location);
            renderForecast(weather);
            showWeather(true);
        }

        /**
         * ============================================================
         * PART 7: MAIN FUNCTIONS
         * ============================================================
         */

        /**
         * searchWeather
         * Main search function: geocode → fetch → render
         */
        async function searchWeather(cityQuery) {
            const query = (cityQuery || cityInput.value).trim();

            if (!query) {
                showError('Please enter a city name.');
                return;
            }

            // Reset UI
            hideError();
            showWeather(false);
            showLoading(true);

            try {
                // Step 1: Geocode the city
                const location = await geocodeCity(query);

                // Step 2: Fetch weather data
                const weather = await fetchWeather(location.latitude, location.longitude);

                // Step 3: Render the data
                renderAll(weather, location);

                // Step 4: Save to localStorage
                currentCity = location.name;
                localStorage.setItem(STORAGE_KEY, location.name);

                // Update input with the formatted city name
                cityInput.value = location.name;

            } catch (error) {
                showError(error.message);
                showWeather(false);
                console.error('Weather App Error:', error);
            } finally {
                showLoading(false);
            }
        }

        /**
         * getLocationWeather
         * Uses Geolocation API to get weather for current position
         */
        async function getLocationWeather() {
            if (!navigator.geolocation) {
                showError('Geolocation is not supported by your browser.');
                return;
            }

            hideError();
            showWeather(false);
            showLoading(true);

            try {
                const position = await new Promise((resolve, reject) => {
                    navigator.geolocation.getCurrentPosition(resolve, reject, {
                        enableHighAccuracy: true,
                        timeout: 10000,
                        maximumAge: 60000
                    });
                });

                const { latitude, longitude } = position.coords;

                // Reverse geocode to get city name (using Open-Meteo geocoding in reverse)
                // Open-Meteo doesn't support reverse geocoding directly, so we use a workaround
                // We'll fetch the weather directly with coordinates and show "Current Location"
                const weather = await fetchWeather(latitude, longitude);

                const location = {
                    name: 'Current Location',
                    country: '',
                    latitude,
                    longitude
                };

                renderAll(weather, location);
                cityInput.value = 'Current Location';
                currentCity = 'Current Location';
                localStorage.setItem(STORAGE_KEY, 'Current Location');

            } catch (error) {
                if (error.code === 1) {
                    showError('Location access denied. Please allow location access or search manually.');
                } else if (error.code === 2) {
                    showError('Location unavailable. Please try again or search manually.');
                } else if (error.code === 3) {
                    showError('Location request timed out. Please try again or search manually.');
                } else {
                    showError(`Location error: ${error.message}`);
                }
                console.error('Geolocation error:', error);
            } finally {
                showLoading(false);
            }
        }

        /**
         * toggleUnit
         * Toggles between Celsius and Fahrenheit
         */
        function toggleUnit() {
            isCelsius = !isCelsius;
            localStorage.setItem(UNIT_KEY, isCelsius ? 'c' : 'f');

            // Update button text
            unitBtn.textContent = isCelsius ? '°F' : '°C';

            // Re-render if we have data
            if (weatherDisplay.classList.contains('visible')) {
                // Re-fetch to get fresh data with new unit
                // For now, just re-render with existing data
                // We need to store the last weather data
                // For simplicity, we'll re-run the last search
                const lastCity = localStorage.getItem(STORAGE_KEY);
                if (lastCity) {
                    searchWeather(lastCity);
                }
            }
        }

        /**
         * ============================================================
         * PART 8: EVENT HANDLING
         * ============================================================
         */

        searchBtn.addEventListener('click', () => searchWeather());

        cityInput.addEventListener('keydown', (event) => {
            if (event.key === 'Enter') {
                event.preventDefault();
                searchWeather();
            }
        });

        locationBtn.addEventListener('click', getLocationWeather);

        unitBtn.addEventListener('click', toggleUnit);

        /**
         * ============================================================
         * PART 9: INITIALIZATION
         * ============================================================
         */

        async function init() {
            // Load unit preference
            const savedUnit = localStorage.getItem(UNIT_KEY);
            if (savedUnit === 'f') {
                isCelsius = false;
                unitBtn.textContent = '°C';
            }

            // Load last searched city
            const lastCity = localStorage.getItem(STORAGE_KEY);

            if (lastCity) {
                cityInput.value = lastCity;
                await searchWeather(lastCity);
            } else {
                // Default to London
                cityInput.value = 'London';
                await searchWeather('London');
            }
        }

        // Start the app
        init();

        /**
         * ============================================================
         * PART 10: DEMONSTRATION (Console Output)

        console.log('  ✅ My Location (Geolocation API)');
        console.log('  ✅ Temperature unit toggle (°C/°F)');
        console.log('  ✅ Loading states');
        console.log('  ✅ Error handling');
        console.log('  ✅ localStorage (remembers last city)');
        console.log('  ✅ 7-day forecast');
        console.log('  ✅ Responsive design');
        console.log('\n🔍 Try searching: Tokyo, New York, Paris, Sydney');
        console.log('📍 Click "My Location" for local weather');
        console.log('🌡️ Click °F/°C to toggle units');
    </script>
