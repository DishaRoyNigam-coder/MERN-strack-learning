<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Body Parser Demo</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: #e2e8f0;
      min-height: 100vh;
      padding: 40px 20px;
    }
    .container { max-width: 900px; margin: 0 auto; }
    h1 { color: #60a5fa; margin-bottom: 8px; }
    .subtitle { color: #94a3b8; margin-bottom: 30px; }
    .section {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 20px;
    }
    .section h2 { color: #fcd34d; font-size: 1.1rem; margin-bottom: 16px; }
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 0.85rem; color: #94a3b8; margin-bottom: 4px; }
    .form-group input {
      width: 100%;
      padding: 10px 14px;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      color: #e2e8f0;
      font-size: 0.95rem;
    }
    .form-group input:focus { outline: none; border-color: #3b82f6; }
    button {
      padding: 10px 20px;
      background: #3b82f6;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      margin-right: 8px;
    }
    button:hover { background: #2563eb; }
    button.secondary { background: #64748b; }
    button.secondary:hover { background: #475569; }
    .result {
      margin-top: 16px;
      background: #0a0f1a;
      border-radius: 8px;
      padding: 16px;
      font-family: 'Courier New', monospace;
      font-size: 0.85rem;
      color: #94a3b8;
      max-height: 300px;
      overflow-y: auto;
      white-space: pre-wrap;
    }
    .method-tag {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 4px;
      font-weight: 700;
      font-size: 0.7rem;
      color: #fff;
      margin-right: 8px;
    }
    .json { background: #22c55e; }
    .form { background: #3b82f6; }
  </style>
</head>
<body>
  <div class="container">
    <h1>📥 Body Parser Demo</h1>
    <p class="subtitle">Test JSON and form-urlencoded body parsing</p>

    <!-- JSON Form -->
    <div class="section">
      <h2><span class="method-tag json">JSON</span> Create User (application/json)</h2>
      <div class="form-group">
        <label>Name</label>
        <input type="text" id="jsonName" placeholder="Alice Johnson" value="Charlie" />
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="jsonEmail" placeholder="alice@example.com" value="charlie@example.com" />
      </div>
      <div class="form-group">
        <label>Age</label>
        <input type="number" id="jsonAge" placeholder="30" value="30" />
      </div>
      <button onclick="sendJson()">Send JSON</button>
      <button class="secondary" onclick="sendInvalidJson()">Send Invalid JSON</button>
    </div>

    <!-- Form-urlencoded -->
    <div class="section">
      <h2><span class="method-tag form">FORM</span> Create User (x-www-form-urlencoded)</h2>
      <div class="form-group">
        <label>Name</label>
        <input type="text" id="formName" placeholder="Dave Wilson" value="Dave Wilson" />
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="formEmail" placeholder="dave@example.com" value="dave@example.com" />
      </div>
      <div class="form-group">
        <label>Age</label>
        <input type="number" id="formAge" placeholder="25" value="25" />
      </div>
      <button onclick="sendForm()">Send Form Data</button>
    </div>

    <!-- Inspect -->
    <div class="section">
      <h2>🔍 Inspect Request Body</h2>
      <p style="color: #94a3b8; font-size: 0.9rem; margin-bottom: 12px;">
        Send a request to see what the server received:
      </p>
      <button onclick="inspectJson()">Inspect JSON</button>
      <button onclick="inspectForm()">Inspect Form</button>
    </div>

    <!-- Result -->
    <div class="result" id="result">Click a button to see the response...</div>
  </div>

  <script>
    const resultEl = document.getElementById('result');

    function showResult(data, status) {
      resultEl.textContent = `Status: ${status}\n\n${JSON.stringify(data, null, 2)}`;
    }

    function showError(err) {
      resultEl.textContent = `❌ Error: ${err.message}`;
    }

    // --- JSON ---
    async function sendJson() {
      const body = {
        name: document.getElementById('jsonName').value,
        email: document.getElementById('jsonEmail').value,
        age: Number(document.getElementById('jsonAge').value),
        role: 'user',
      };

      resultEl.textContent = '⏳ Sending JSON...';

      try {
        const response = await fetch('/api/users', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });
        const data = await response.json();
        showResult(data, response.status);
      } catch (err) {
        showError(err);
      }
    }

    async function sendInvalidJson() {
      resultEl.textContent = '⏳ Sending invalid JSON...';
      try {
        const response = await fetch('/api/users', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: '{"name": "Broken", "email": }', // Invalid!
        });
        const data = await response.json();
        showResult(data, response.status);
      } catch (err) {
        showError(err);
      }
    }

    // --- Form ---
    async function sendForm() {
      const params = new URLSearchParams();
      params.append('name', document.getElementById('formName').value);
      params.append('email', document.getElementById('formEmail').value);
      params.append('age', document.getElementById('formAge').value);

      resultEl.textContent = '⏳ Sending form data...';

      try {
        const response = await fetch('/api/users', {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: params.toString(),
        });
        const data = await response.json();
        showResult(data, response.status);
      } catch (err) {
        showError(err);
      }
    }

    // --- Inspect ---
    async function inspectJson() {
      try {
        const response = await fetch('/api/demo/inspect', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: 'Hello', count: 42, active: true }),
        });
        const data = await response.json();
        showResult(data, response.status);
      } catch (err) {
        showError(err);
      }
    }

    async function inspectForm() {
      const params = new URLSearchParams();
      params.append('message', 'Hello');
      params.append('count', '42');
      params.append('active', 'true');

      try {
        const response = await fetch('/api/demo/inspect', {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: params.toString(),
        });
        const data = await response.json();
        showResult(data, response.status);
      } catch (err) {
        showError(err);
      }
    }
  </script>
</body>
</html>
