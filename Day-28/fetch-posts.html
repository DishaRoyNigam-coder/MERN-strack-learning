<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Post Viewer - Day 28</title>

    <style>
        /* ---------- RESET & BASE ---------- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f0f4ff 0%, #e2e8f0 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 24px;
            padding: 35px 30px 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.08);
            animation: fadeSlideUp 0.6s ease-out;
        }

        @keyframes fadeSlideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ---------- HEADER ---------- */
        .header {
            text-align: center;
            margin-bottom: 28px;
        }

        .header .icon {
            font-size: 2.8rem;
            display: block;
        }

        .header h1 {
            font-size: 2rem;
            color: #0f172a;
            font-weight: 800;
        }

        .header p {
            color: #64748b;
            font-size: 0.95rem;
        }

        .header .badge {
            display: inline-block;
            background: #dbeafe;
            color: #1d4ed8;
            padding: 4px 16px;
            border-radius: 30px;
            font-size: 0.8rem;
            font-weight: 600;
            margin-top: 8px;
        }

        /* ---------- CONTROLS ---------- */
        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 20px;
            padding: 16px 20px;
            background: #f8fafc;
            border-radius: 16px;
            border: 1px solid #e2e8f0;
        }

        .controls .search-group {
            flex: 1 1 200px;
            display: flex;
            gap: 10px;
        }

        .controls .search-group input {
            flex: 1;
            padding: 10px 14px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 0.95rem;
            transition: border-color 0.3s ease;
            min-width: 120px;
        }

        .controls .search-group input:focus {
            outline: none;
            border-color: #3b82f6;
        }

        .controls .filter-group {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        .controls .filter-group select {
            padding: 10px 14px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 0.95rem;
            background: #fff;
            transition: border-color 0.3s ease;
        }

        .controls .filter-group select:focus {
            outline: none;
            border-color: #3b82f6;
        }

        .controls button {
            padding: 10px 20px;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: transform 0.25s ease, box-shadow 0.25s ease;
            white-space: nowrap;
        }

        .controls button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
        }

        .controls button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        .btn-fetch {
            background: #0f172a;
            color: #fff;
        }

        .btn-fetch:hover:not(:disabled) {
            background: #1e293b;
        }

        .btn-clear {
            background: #e2e8f0;
            color: #0f172a;
        }

        .btn-clear:hover:not(:disabled) {
            background: #cbd5e1;
        }

        /* ---------- LOADING ---------- */
        .loading {
            display: none;
            text-align: center;
            padding: 40px 20px;
            color: #64748b;
        }

        .loading.visible {
            display: block;
            animation: pulse 1.2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .loading .spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 4px solid #e2e8f0;
            border-top-color: #0f172a;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 12px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ---------- STATS ---------- */
        .stats {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            padding: 10px 16px;
            background: #f1f5f9;
            border-radius: 12px;
            font-size: 0.9rem;
            color: #475569;
            margin-bottom: 20px;
        }

        .stats .count {
            font-weight: 700;
            color: #0f172a;
        }

        .stats .info {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
        }

        /* ---------- POSTS GRID ---------- */
        .posts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }

        .post-card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            padding: 20px 18px 22px;
            transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
            display: flex;
            flex-direction: column;
        }

        .post-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
            border-color: #3b82f6;
        }

        .post-card .post-id {
            font-size: 0.75rem;
            color: #94a3b8;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .post-card .post-title {
            font-weight: 700;
            font-size: 1.1rem;
            color: #0f172a;
            margin-bottom: 8px;
            line-height: 1.4;
        }

        .post-card .post-body {
            font-size: 0.9rem;
            color: #64748b;
            line-height: 1.6;
            flex-grow: 1;
            margin-bottom: 12px;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .post-card .post-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 12px;
            border-top: 1px solid #e2e8f0;
            font-size: 0.8rem;
            color: #94a3b8;
        }

        .post-card .post-meta .user-name {
            font-weight: 600;
            color: #0f172a;
        }

        .post-card .post-meta .user-id {
            background: #dbeafe;
            color: #1d4ed8;
            padding: 2px 10px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 0.7rem;
        }

        /* ---------- EMPTY STATE ---------- */
        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px 20px;
            color: #94a3b8;
        }

        .empty-state .big-emoji {
            font-size: 4rem;
            display: block;
            margin-bottom: 12px;
        }

        .empty-state h3 {
            color: #475569;
            font-size: 1.2rem;
        }

        /* ---------- ERROR ---------- */
        .error-box {
            display: none;
            padding: 16px 20px;
            background: #fef2f2;
            border: 2px solid #fecaca;
            border-radius: 12px;
            color: #991b1b;
            margin-bottom: 16px;
        }

        .error-box.visible {
            display: block;
            animation: fadeIn 0.3s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .error-box .error-title {
            font-weight: 700;
        }

        /* ---------- RESPONSIVE ---------- */
        @media (max-width: 600px) {
            .container {
                padding: 24px 16px;
            }
            .controls {
                flex-direction: column;
            }
            .controls .search-group {
                flex-direction: column;
            }
            .controls .filter-group {
                flex-direction: column;
                width: 100%;
            }
            .controls .filter-group select {
                width: 100%;
            }
            .controls button {
                width: 100%;
            }
            .posts-grid {
                grid-template-columns: 1fr;
            }
            .stats {
                flex-direction: column;
                gap: 8px;
                text-align: center;
            }
        }
    </style>
</head>
<body>

    <div class="container">

        <!-- HEADER -->
        <div class="header">
            <span class="icon">📝</span>
            <h1>Post Viewer</h1>
            <p>Fetch and display posts from JSONPlaceholder API.</p>
            <span class="badge">🌐 Fetch API • JSON • Async/Await</span>
        </div>

        <!-- CONTROLS -->
        <div class="controls">
            <div class="search-group">
                <input
                    type="text"
                    id="searchInput"
                    placeholder="🔍 Search posts..."
                    oninput="handleSearch()"
                />
            </div>
            <div class="filter-group">
                <select id="userFilter" onchange="handleFilter()">
                    <option value="all">All Users</option>
                </select>
                <button class="btn-fetch" id="fetchBtn">🔄 Fetch Posts</button>
                <button class="btn-clear" id="clearBtn">🗑️ Clear</button>
            </div>
        </div>

        <!-- ERROR -->
        <div class="error-box" id="errorBox">
            <div class="error-title">❌ Error</div>
            <div id="errorMessage">Something went wrong.</div>
        </div>

        <!-- LOADING -->
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <div>Loading posts...</div>
        </div>

        <!-- STATS -->
        <div class="stats" id="stats">
            <div>📊 <span class="count" id="postCount">0</span> posts</div>
            <div class="info">
                <span id="userCount">👤 0 users</span>
                <span id="lastUpdated">⏱️ Not loaded</span>
            </div>
        </div>

        <!-- POSTS GRID -->
        <div class="posts-grid" id="postsGrid">
            <div class="empty-state">
                <span class="big-emoji">📭</span>
                <h3>No posts to display</h3>
                <p style="color: #94a3b8;">Click "Fetch Posts" to load data from the API.</p>
            </div>
        </div>

    </div>

    <!-- ============================================================ -->
    <!-- JAVASCRIPT                                                    -->
    <!-- ============================================================ -->
    <script>
        /**
         * ============================================================
         * PART 1: CONFIGURATION
         * ============================================================
         */

        const API_URL = 'https://jsonplaceholder.typicode.com/posts';
        const USERS_URL = 'https://jsonplaceholder.typicode.com/users';

        /**
         * ============================================================
         * PART 2: STATE
         * ============================================================
         */

        let allPosts = [];
        let allUsers = [];
        let filteredPosts = [];
        let currentUserFilter = 'all';
        let currentSearchTerm = '';

        /**
         * ============================================================
         * PART 3: DOM REFERENCES
         * ============================================================
         */

        const postsGrid = document.getElementById('postsGrid');
        const loading = document.getElementById('loading');
        const errorBox = document.getElementById('errorBox');
        const errorMessage = document.getElementById('errorMessage');
        const postCount = document.getElementById('postCount');
        const userCount = document.getElementById('userCount');
        const lastUpdated = document.getElementById('lastUpdated');
        const fetchBtn = document.getElementById('fetchBtn');
        const clearBtn = document.getElementById('clearBtn');
        const searchInput = document.getElementById('searchInput');
        const userFilter = document.getElementById('userFilter');

        /**
         * ============================================================
         * PART 4: HELPER FUNCTIONS
         * ============================================================
         */

        function showLoading(visible) {
            loading.classList.toggle('visible', visible);
        }

        function showError(message) {
            errorMessage.textContent = message;
            errorBox.classList.add('visible');
            clearTimeout(errorBox._timeout);
            errorBox._timeout = setTimeout(() => {
                errorBox.classList.remove('visible');
            }, 5000);
        }

        function hideError() {
            errorBox.classList.remove('visible');
        }

        function updateStats(posts) {
            postCount.textContent = posts.length;

            // Count unique users
            const userIds = new Set(posts.map(p => p.userId));
            userCount.textContent = `👤 ${userIds.size} users`;

            const now = new Date();
            lastUpdated.textContent = `⏱️ Updated: ${now.toLocaleTimeString()}`;
        }

        function getUsers(posts) {
            const userIds = [...new Set(posts.map(p => p.userId))];
            return userIds.map(id => {
                const user = allUsers.find(u => u.id === id);
                return user || { id, name: `User ${id}` };
            });
        }

        /**
         * ============================================================
         * PART 5: API FETCH FUNCTIONS (Using Async/Await)
         * ============================================================
         */

        /**
         * fetchPosts
         * Fetches posts from the JSONPlaceholder API
         */
        async function fetchPosts() {
            try {
                const response = await fetch(API_URL);

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();
                return data;
            } catch (error) {
                throw new Error(`Failed to fetch posts: ${error.message}`);
            }
        }

        /**
         * fetchUsers
         * Fetches users from the JSONPlaceholder API
         */
        async function fetchUsers() {
            try {
                const response = await fetch(USERS_URL);

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();
                return data;
            } catch (error) {
                throw new Error(`Failed to fetch users: ${error.message}`);
            }
        }

        /**
         * loadData
         * Loads posts and users from the API
         */
        async function loadData() {
            showLoading(true);
            hideError();

            try {
                // Fetch posts and users in parallel (faster!)
                const [posts, users] = await Promise.all([
                    fetchPosts(),
                    fetchUsers()
                ]);

                allPosts = posts;
                allUsers = users;

                // Populate user filter
                populateUserFilter(users);

                // Apply initial filters
                applyFilters();

                // Update stats
                updateStats(filteredPosts);

                // Update last updated time
                const now = new Date();
                lastUpdated.textContent = `⏱️ Updated: ${now.toLocaleTimeString()}`;

                showLoading(false);
                return posts;

            } catch (error) {
                showLoading(false);
                showError(error.message);
                return [];
            }
        }

        /**
         * populateUserFilter
         * Populates the user filter dropdown
         */
        function populateUserFilter(users) {
            userFilter.innerHTML = '<option value="all">All Users</option>';

            users.forEach(user => {
                const option = document.createElement('option');
                option.value = user.id;
                option.textContent = user.name;
                userFilter.appendChild(option);
            });
        }

        /**
         * ============================================================
         * PART 6: FILTERING & SEARCHING
         * ============================================================
         */

        /**
         * applyFilters
         * Applies search and filter to the posts
         */
        function applyFilters() {
            let result = [...allPosts];

            // Filter by user
            if (currentUserFilter !== 'all') {
                result = result.filter(post =>
                    post.userId === parseInt(currentUserFilter)
                );
            }

            // Filter by search term
            if (currentSearchTerm.trim()) {
                const term = currentSearchTerm.toLowerCase().trim();
                result = result.filter(post =>
                    post.title.toLowerCase().includes(term) ||
                    post.body.toLowerCase().includes(term)
                );
            }

            filteredPosts = result;
            renderPosts(result);
            updateStats(result);

            // Update the count in the stats
            postCount.textContent = result.length;
        }

        /**
         * handleSearch
         * Called when the search input changes
         */
        function handleSearch() {
            currentSearchTerm = searchInput.value;
            applyFilters();
        }

        /**
         * handleFilter
         * Called when the user filter changes
         */
        function handleFilter() {
            currentUserFilter = userFilter.value;
            applyFilters();
        }

        /**
         * ============================================================
         * PART 7: RENDER FUNCTION
         * ============================================================
         */

        /**
         * renderPosts
         * Renders posts to the grid
         */
        function renderPosts(posts) {
            if (!posts || posts.length === 0) {
                postsGrid.innerHTML = `
                    <div class="empty-state">
                        <span class="big-emoji">🔍</span>
                        <h3>No posts found</h3>
                        <p style="color: #94a3b8;">
                            ${allPosts.length === 0 ? 'Click "Fetch Posts" to load data.' : 'Try adjusting your filters.'}
                        </p>
                    </div>
                `;
                return;
            }

            postsGrid.innerHTML = posts.map(post => {
                // Find the user for this post
                const user = allUsers.find(u => u.id === post.userId);
                const userName = user ? user.name : `User ${post.userId}`;

                // Truncate body if too long
                const body = post.body.length > 150 ?
                    post.body.slice(0, 150) + '...' :
                    post.body;

                return `
                    <div class="post-card">
                        <div class="post-id">Post #${post.id}</div>
                        <div class="post-title">${escapeHTML(post.title)}</div>
                        <div class="post-body">${escapeHTML(body)}</div>
                        <div class="post-meta">
                            <span class="user-name">✍️ ${escapeHTML(userName)}</span>
                            <span class="user-id">User ${post.userId}</span>
                        </div>
                    </div>
                `;
            }).join('');
        }

        /**
         * escapeHTML
         * Prevents XSS attacks by escaping HTML characters
         */
        function escapeHTML(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        /**
         * ============================================================
         * PART 8: CLEAR FUNCTION
         * ============================================================
         */

        function clearAll() {
            allPosts = [];
            filteredPosts = [];
            postsGrid.innerHTML = `
                <div class="empty-state">
                    <span class="big-emoji">📭</span>
                    <h3>No posts to display</h3>
                    <p style="color: #94a3b8;">Click "Fetch Posts" to load data from the API.</p>
                </div>
            `;
            postCount.textContent = '0';
            userCount.textContent = '👤 0 users';
            lastUpdated.textContent = '⏱️ Not loaded';
            searchInput.value = '';
            userFilter.value = 'all';
            hideError();
        }

        /**
         * ============================================================
         * PART 9: EVENT HANDLING
         * ============================================================
         */

        fetchBtn.addEventListener('click', async () => {
            fetchBtn.disabled = true;
            fetchBtn.textContent = '⏳ Loading...';
            await loadData();
            fetchBtn.disabled = false;
            fetchBtn.textContent = '🔄 Fetch Posts';
        });

        clearBtn.addEventListener('click', clearAll);

        /**
         * ============================================================
         * PART 10: INITIALIZATION
         * ============================================================
         */

        // Load data automatically on page load
        (async function init() {
            fetchBtn.disabled = true;
            fetchBtn.textContent = '⏳ Loading...';
            await loadData();
            fetchBtn.disabled = false;
            fetchBtn.textContent = '🔄 Fetch Posts';
        })();

        /**
         * ============================================================
         * PART 11: DEMONSTRATION (Console Output)
         * ============================================================
         * (Open the browser console to see the output!)
         */

        console.log('\n=== DAY 28: FETCH API & JSON ===\n');

        // --- 1. Basic Fetch Example ---
        console.log('--- 1. Basic Fetch ---');

        async function demoFetch() {
            try {
                const response = await fetch('https://jsonplaceholder.typicode.com/posts/1');
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const data = await response.json();
                console.log('  ✅ Fetched post:', data.title);
            } catch (error) {
                console.log('  ❌ Error:', error.message);
            }
        }
        demoFetch();

        // --- 2. JSON Parsing ---
        console.log('\n--- 2. JSON Parsing ---');

        const jsonString = '{"userId": 1, "id": 1, "title": "Test Post"}';
        console.log('  JSON string:', jsonString);
        const parsed = JSON.parse(jsonString);
        console.log('  Parsed object:', parsed);
        console.log('  Title:', parsed.title);

        const stringified = JSON.stringify(parsed);
        console.log('  Stringified:', stringified);

        // --- 3. HTTP Methods ---
        console.log('\n--- 3. HTTP Methods ---');

        console.log('  GET: Fetch data (default)');
        console.log('  POST: Create new data');
        console.log('  PUT: Update existing data');
        console.log('  DELETE: Remove data');
        console.log('  PATCH: Partial update');

        // --- 4. Headers Example ---
        console.log('\n--- 4. Headers ---');

        console.log('  Headers provide metadata:');
        console.log('  - Content-Type: application/json');
        console.log('  - Authorization: Bearer TOKEN');
        console.log('  - Accept: application/json');

        // --- 5. Query Parameters ---
        console.log('\n--- 5. Query Parameters ---');

        const params = new URLSearchParams({
            userId: 1,
            _limit: 5,
            _sort: 'id'
        });
        console.log('  Query string:', `?${params}`);

        // --- 6. Error Handling Patterns ---
        console.log('\n--- 6. Error Handling ---');

        console.log('  ✅ Check response.ok');
        console.log('  ✅ Use try/catch with async/await');
        console.log('  ✅ Handle network errors');
        console.log('  ✅ Parse errors (invalid JSON)');

        console.log('\n=== Post Viewer is ready! Click "Fetch Posts" to load data. ===');
        console.log('📌 The app uses fetch() with async/await to get real data.');
        console.log('📌 Search, filter, and explore the data.');
        console.log('📌 All posts are rendered with proper HTML escaping.');
    </script>

</body>
</html>
